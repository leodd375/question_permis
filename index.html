<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Questions permis">
<meta name="theme-color" content="#0f3d3e">
<title>Questions du permis — révisions</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#1d2321;--mute:#6b736f;--line:#e4e0d6;--acc:#0f3d3e;--acc2:#e0a526;--ok:#2f7d4f;--ko:#b6423a;--okbg:#e6f2ea;--kobg:#f8e7e5;
--vi:#3b6ea5;--ve:#7a5aa6;--qs:#c2701a;--ps:#b6423a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;gap:10px;margin:6px 0 18px}
header h1{font-size:20px;margin:0;flex:1;letter-spacing:-.01em}
.back{border:0;background:none;color:var(--acc);font-size:16px;padding:8px 4px;font-weight:600;cursor:pointer}
.hero{background:var(--acc);color:#fff;border-radius:18px;padding:18px 18px 16px;margin-bottom:16px}
.hero .big{font-size:34px;font-weight:700;line-height:1}
.hero .sub{opacity:.8;font-size:14px;margin-top:4px}
.bar{height:8px;background:rgba(255,255,255,.2);border-radius:99px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc2);border-radius:99px;transition:width .4s}
.modes{display:grid;gap:10px}
.mode{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.mode:active{transform:scale(.99)}
.mode .n{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.mode b{display:block;font-size:17px}
.mode span{color:var(--mute);font-size:14px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:26px 0 10px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.grid button{aspect-ratio:1;border:0;border-radius:6px;font-weight:600;font-size:12px;line-height:1;font-family:inherit;background:#e9e5db;color:var(--mute);cursor:pointer;padding:0}
.grid .s3{background:var(--ok);color:#fff}.grid .s2{background:#8fbf9f;color:#fff}.grid .s1{background:#e8b98a;color:#fff}.grid .s0{background:var(--ko);color:#fff}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.03em;padding:4px 9px;border-radius:99px;color:#fff;margin-bottom:12px}
.t-vi{background:var(--vi)}.t-ve{background:var(--ve)}.t-qs{background:var(--qs)}.t-ps{background:var(--ps)}
.pract{background:#efe9da;color:#6a5a2c;margin-left:6px}
.q{font-size:20px;font-weight:650;line-height:1.35;margin:0 0 6px}
.nums{font-size:13px;color:var(--mute)}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{text-align:left;font-family:inherit;font-size:16px;background:#faf9f6;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--ink);cursor:pointer;white-space:pre-line}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.opt[disabled]{cursor:default}
.ans{margin-top:16px;padding:14px;border-radius:14px;background:#f3f6f4;border-left:4px solid var(--acc);white-space:pre-line}
.note{margin-top:10px;font-size:14px;background:#fff6e0;border-radius:12px;padding:10px 12px;color:#6a5310}
.hidden{display:none!important}
.actions{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;font-weight:600;font-size:16px;line-height:1;font-family:inherit;border:0;border-radius:14px;padding:16px;cursor:pointer;background:var(--acc);color:#fff}
.btn.sec{background:#e9e5db;color:var(--ink)}
.btn.ok{background:var(--ok)}.btn.ko{background:var(--ko)}
.prog{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin-bottom:10px}
.pbar{height:5px;background:var(--line);border-radius:99px;margin-bottom:16px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.center{text-align:center}
.score{font-size:56px;font-weight:800;color:var(--acc);margin:10px 0 0}
.counter{font-size:64px;font-weight:800;text-align:center;letter-spacing:.04em;color:var(--acc);font-variant-numeric:tabular-nums;margin:6px 0 2px}
.small{font-size:14px;color:var(--mute)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 12px;font-weight:600;font-size:14px;line-height:1;font-family:inherit;color:var(--ink);cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.reset{margin-top:26px;background:none;border:0;color:var(--mute);font-size:14px;font-family:inherit;text-decoration:underline;cursor:pointer;padding:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:20px;z-index:9}
.modal .card{max-width:380px}
</style>
</head>

<div class="wrap" id="app"></div>
<script>
const DATA = [[{"t": "Vérif. extérieure", "q": "Montrez où se situent les gicleurs de lave-glace avant.", "a": "Sur le capot ou à la base du pare-brise.", "practical": true}, {"t": "Sécurité routière", "q": "Quelle est la principale conséquence d’un dispositif de lave-glace défaillant ?", "a": "Une mauvaise visibilité due à l’impossibilité de nettoyer le pare-brise.", "practical": false}, {"t": "Premiers secours", "q": "Qu’est ce qu’un défibrillateur automatisé externe (DAE) ?", "a": "C’est un appareil qui peut permettre de rétablir une activité cardiaque normale à une victime en arrêt cardiaque.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Montrez la commande de réglage de hauteur des feux.", "a": "Dispositif en général à gauche du volant.", "practical": false}, {"t": "Sécurité routière", "q": "Pourquoi doit-on régler la hauteur des feux ?", "a": "Pour ne pas éblouir les autres usagers.", "practical": false}, {"t": "Premiers secours", "q": "Comment et pourquoi protéger une zone de danger en cas d’accident de la route ?", "a": "En délimitant clairement et largement la zone de danger de façon visible pour protéger les victimes et éviter un sur-accident.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Montrez où s'effectue le remplissage du produit lave-glace.", "a": "Le candidat ouvre le capot et montre le bocal. Si le candidat a des difficultés pour ouvrir le capot, l'accompagnateur peut lui indiquer comment procéder.", "practical": false}, {"t": "Sécurité routière", "q": "Pourquoi est-il préférable d'utiliser un liquide spécial en hiver ?", "a": "Pour éviter le gel du liquide.", "practical": false}, {"t": "Premiers secours", "q": "Quels comportements adopter en cas de diffusion du signal d’alerte du Système d’Alerte et d’Information des Populations (SAIP) ?", "a": "- Se mettre en sécurité.\n- S'informer grâce aux médias et sites internet des autorités dès que leur consultation est possible.\n- Respecter les consignes des autorités.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Mettez le rétroviseur intérieur en position \"nuit\". Si le rétroviseur de l'accompagnateur gêne la manipulation du dispositif, l'explication suffit.", "a": "Si le véhicule possède un système automatique de mise en position \"nuit\" du rétroviseur intérieur, le candidat l'indique.", "practical": false}, {"t": "Sécurité routière", "q": "Quel est l’intérêt de la position nuit ?", "a": "Ne pas être ébloui par les feux du véhicule suiveur.", "practical": false}, {"t": "Premiers secours", "q": "Comment est composé le signal d’alerte du Système d’Alerte et d’Information des Populations (SAIP) diffusé par les sirènes ?", "a": "Il se compose de deux codes distincts : - le Signal National d’Alerte (SNA), variation du signal sur trois cycles successifs.\n- Le signal de fin d’alerte, signal continu.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Contrôlez l'état du flanc sur l'un des pneumatiques.", "a": "En bon état (toute anomalie doit être signalée).", "practical": false}, {"t": "Sécurité routière", "q": "Citez un endroit où l'on peut trouver les pressions préconisées pour les pneumatiques ?", "a": "Elles sont indiquées : - soit sur une plaque sur une portière. - soit dans la notice d'utilisation du véhicule. - soit au niveau de la trappe à carburant.", "practical": false}, {"t": "Premiers secours", "q": "Sur autoroute, comment indiquer avec précision les lieux de l’accident depuis un téléphone portable ?", "a": "En indiquant le numéro de l’autoroute, le sens de circulation et le point kilométrique.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Faites fonctionner les essuie-glaces avant du véhicule sur la position la plus rapide.", "a": "Mettre le contact puis la manette d'essuie-glace sur la position la plus rapide.", "practical": true}, {"t": "Sécurité routière", "q": "Comment détecter leur usure en circulation ?", "a": "En cas de pluie, lorsqu'ils laissent des traces sur le pare-brise.", "practical": false}, {"t": "Premiers secours", "q": "Comment vérifier la respiration d’une victime ?", "a": "Regarder si le ventre et la poitrine se soulèvent et sentir de l’air à l’expiration.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Vérifiez l'état et la propreté des plaques d'immatriculation.", "a": "Vérification des plaques à l'avant et à l'arrière, propres et en bon état (toute anomalie doit être signalée).", "practical": false}, {"t": "Sécurité routière", "q": "Quelles sont les précautions à prendre en cas d'installation d'un porte-vélo ?", "a": "La plaque d'immatriculation et les feux doivent être visibles.", "practical": false}, {"t": "Premiers secours", "q": "Qu’est-ce qu’une perte de connaissance ?", "a": "C’est lorsque la victime ne répond pas et ne réagit pas mais respire.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Vérifiez la présence du gilet de haute visibilité.", "a": "Le candidat doit indiquer où il se trouve sans obligation de le sortir. Le terme \" gilet jaune\" peut être utilisé si le candidat ne comprend pas.", "practical": false}, {"t": "Sécurité routière", "q": "En cas de panne ou d'accident, quel autre accessoire de sécurité est obligatoire ?", "a": "Le triangle de pré-signalisation.", "practical": false}, {"t": "Premiers secours", "q": "Si un dégagement d'urgence de la victime est nécessaire, où doit-elle être déplacée ?", "a": "Dans un endroit suffisamment éloigné du danger et de ses conséquences.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Montrez où s'effectue le contrôle du niveau du liquide de frein.", "a": "Le candidat montre que le niveau est entre le mini et le maxi. Si le candidat a des difficultés pour ouvrir le capot, l'accompagnateur peut lui indiquer comment procéder.", "practical": false}, {"t": "Sécurité routière", "q": "Quelle est la conséquence d'un niveau insuffisant du liquide de frein ?", "a": "Une perte d'efficacité du freinage.", "practical": false}, {"t": "Premiers secours", "q": "En cas de panne ou d’accident, quel équipement de sécurité doit être porté avant de quitter le véhicule ?", "a": "Il faut porter le gilet de haute visibilité avant de sortir du véhicule. Le terme \" gilet jaune\" peut être utilisé par le candidat.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Vérifiez la présence du certificat d'immatriculation du véhicule (ou carte grise).", "a": "La photocopie est acceptée.", "practical": false}, {"t": "Sécurité routière", "q": "Quels sont les deux autres documents obligatoires à présenter en cas de contrôle par les forces de l'ordre ?", "a": "L’attestation d'assurance et le permis de conduire.", "practical": false}, {"t": "Premiers secours", "q": "Pourquoi l’alerte auprès des services de secours doit-elle être rapide et précise ?", "a": "Pour permettre aux services de secours d'apporter les moyens adaptés aux victimes dans le délai le plus court.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Contrôlez l'état de tous les balais d'essuie-glace du véhicule.", "a": "Vérifier avant et arrière : caoutchouc ni fendu, ni déchiré, ni durci (toute anomalie doit être signalée).", "practical": true}, {"t": "Sécurité routière", "q": "Quel est le risque de circuler avec des balais d'essuie-glace défectueux ?", "a": "Une mauvaise visibilité en cas d'intempéries.", "practical": false}, {"t": "Premiers secours", "q": "Quels sont les numéros d’urgence à composer ?", "a": "- Le 18, numéro d'appel des sapeurs-pompiers.\n- Le 15, numéro d'appel des SAMU.\n- Le 112, numéro de téléphone réservé aux appels d’urgence, valide dans l’ensemble de l’Union Européenne.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Montrez l'indicateur de niveau de carburant.", "a": "Montrer la jauge à carburant sur le tableau de bord (contact mis).", "practical": true}, {"t": "Sécurité routière", "q": "Quelles sont les précautions à prendre lors du remplissage du réservoir ?", "a": "Arrêter le moteur, ne pas fumer, ne pas téléphoner.", "practical": false}, {"t": "Premiers secours", "q": "Quels comportements adopter en présence d’une victime qui ne répond pas et ne réagit pas, mais respire ?", "a": "- La placer en position stable sur le côté ou position latérale de sécurité.\n- Alerter les secours.\n- Surveiller la respiration de la victime jusqu'à l'arrivée des secours.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Montrez où s'effectue le remplissage du liquide de refroidissement.", "a": "Le candidat ouvre le capot et montre le bocal. Si le candidat a des difficultés pour ouvrir le capot, l'accompagnateur peut lui indiquer comment procéder.", "practical": false}, {"t": "Sécurité routière", "q": "Quel est le danger si l'on complète le niveau du liquide lorsque le moteur est chaud ?", "a": "Un risque de brûlure.", "practical": false}, {"t": "Premiers secours", "q": "Comment arrêter une hémorragie ?", "a": "En appuyant fortement sur l’endroit qui saigne avec les doigts ou avec la paume de la main en mettant un tissu propre sur la plaie.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Actionnez le dégivrage de la lunette arrière et montrez le voyant ou le repère correspondant.", "a": "Appuyer sur le bouton (symbole rectangle avec flèches ondulées) et montrer le voyant qui s'allume.", "practical": true}, {"t": "Sécurité routière", "q": "Quelle peut être la conséquence d'une panne de dégivrage de la lunette arrière ?", "a": "Une insuffisance ou une absence de visibilité vers l'arrière.", "practical": false}, {"t": "Premiers secours", "q": "Hors autoroute ou endroit dangereux, en cas de panne ou d’accident, où doit être placé le triangle de pré-signalisation ?", "a": "Le triangle de pré-signalisation doit être placé à une distance d’environ 30 m de la panne ou de l’accident, ou avant un virage, ou un sommet de côte.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Contrôlez l'état, la propreté et le fonctionnement de tous les clignotants côté trottoir.", "a": "Vérification des clignotants propres, en bon état et fonctionnent (toute anomalie doit être signalée).", "practical": false}, {"t": "Sécurité routière", "q": "Quelle est la signification d'un clignotement plus rapide ?", "a": "Non fonctionnement de l'une des ampoules.", "practical": false}, {"t": "Premiers secours", "q": "Quelles sont les conditions pour réaliser le dégagement d’urgence d’une victime en présence d’un danger réel, immédiat et non contrôlable ?", "a": "La victime doit être visible, facile à atteindre et rien ne doit gêner son dégagement. Il faut être sûr(e) de pouvoir réaliser le dégagement de la victime.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Montrez le voyant d'alerte signalant une pression insuffisante d'huile dans le moteur.", "a": "Mettre le contact et montrer le voyant rouge en forme de burette d'huile.", "practical": true}, {"t": "Sécurité routière", "q": "Quelles sont les conditions à respecter pour contrôler le niveau d'huile ?", "a": "Moteur froid et sur un terrain plat.", "practical": false}, {"t": "Premiers secours", "q": "Quelles sont les trois informations à transmettre aux services de secours ?", "a": "Le numéro de téléphone à partir duquel l’appel est émis, la nature et la localisation la plus précise du problème.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Contrôlez l'état, la propreté et le fonctionnement du ou des feux de brouillard arrière.", "a": "Vérification des feux, propres, en bon état et fonctionnent (toute anomalie doit être signalée).", "practical": false}, {"t": "Sécurité routière", "q": "Dans quels cas les utilise-t-on ?", "a": "Par temps de brouillard et neige.", "practical": false}, {"t": "Premiers secours", "q": "Par quels moyens doit être réalisée l’alerte des secours ?", "a": "L’alerte doit être donnée à l’aide d’un téléphone portable ou, à défaut, d’un téléphone fixe ou d’une borne d’appel d’urgence.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Vérifiez la présence de l’éthylotest.", "a": "Généralement dans la boîte à gants.", "practical": true, "note": "⚠️ Bon à savoir : l'éthylotest n'est plus obligatoire depuis mai 2020 (question parfois neutralisée)."}, {"t": "Sécurité routière", "q": "À partir de quel taux d'alcoolémie, en période de permis probatoire, est-on en infraction ?", "a": "0,2 g /l, c'est à dire 0 verre, car dès le 1er verre ce seuil peut être dépassé.", "practical": false}, {"t": "Premiers secours", "q": "Quel comportement doit-on adopter en présence d’une victime en arrêt cardiaque ?", "a": "- ALERTER: alerter immédiatement les secours.\n- MASSER: pratiquer une réanimation cardio-pulmonaire.\n- DEFIBRILLER: utiliser un défibrillateur automatique (DAE) si possible.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Contrôlez l'état, la propreté et le fonctionnement des feux de détresse à l'avant et à l'arrière.", "a": "Vérification des feux, propres, en bon état et fonctionnent (toute anomalie doit être signalée).", "practical": false}, {"t": "Sécurité routière", "q": "Dans quels cas doit-on les utiliser ?", "a": "En cas de panne, d’accident ou de ralentissement important.", "practical": false}, {"t": "Premiers secours", "q": "Dans quel cas peut-on positionner une victime en Position Latérale de Sécurité (PLS) ?", "a": "Si la victime ne répond pas, ne réagit pas et respire.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Montrez la commande de réglage du volant.", "a": "Le candidat montre l'emplacement. Il ne lui est pas demandé de changer son réglage.", "practical": false}, {"t": "Sécurité routière", "q": "Pourquoi est-il important de bien régler son volant ? Citez deux exemples.", "a": "- Le confort de conduite.\n- L’accessibilité aux commandes.\n- La visibilité du tableau de bord.\n- L’efficacité des airbags.", "practical": false}, {"t": "Premiers secours", "q": "Dans quelle situation peut-on déplacer une victime ?", "a": "En présence d’un danger réel, immédiat, non contrôlable. Le déplacement de la victime doit rester exceptionnel.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Contrôlez l'état, la propreté et le fonctionnement des feux de route.", "a": "Vérification des feux, propres, en bon état et fonctionnent (toute anomalie doit être signalée).", "practical": false}, {"t": "Sécurité routière", "q": "Citez un cas d'utilisation de l’appel lumineux.", "a": "- Pour avertir de son approche.\n- En cas de danger.\n- A la place de l'avertisseur sonore.", "practical": false}, {"t": "Premiers secours", "q": "En cas de panne ou d’accident, quel équipement de sécurité doit être porté avant de quitter le véhicule ?", "a": "Il faut porter le gilet de haute visibilité avant de sortir du véhicule. Le terme \"gilet jaune\" peut être utilisé par le candidat.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Positionnez la commande pour diriger l'air vers le pare-brise.", "a": "La position auto (désembuage automatique) peut être utilisée si le véhicule en est équipé.", "practical": false}, {"t": "Sécurité routière", "q": "Citez deux éléments complémentaires permettant un désembuage efficace.", "a": "- La commande de vitesse de ventilation.\n- La commande d'air chaud.\n- La climatisation.", "practical": false}, {"t": "Premiers secours", "q": "Quel est l’objectif du Signal d’Alerte et d’Information des Populations (SAIP) ?", "a": "Avertir la population d’un danger imminent ou qu’un événement grave est en train de se produire.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Montrez où doit s'effectuer le contrôle du niveau d'huile moteur.", "a": "Le candidat montre la jauge. Pas de manipulation exigée. Si le candidat a des difficultés pour ouvrir le capot, l'accompagnateur peut lui indiquer comment procéder.", "practical": false}, {"t": "Sécurité routière", "q": "Quel est le principal risque d'un manque d'huile moteur ?", "a": "Un risque de détérioration ou de casse du moteur.", "practical": false}, {"t": "Premiers secours", "q": "Comment est diffusée l’alerte émise par le Signal d’Alerte et d’Information aux Populations (SAIP) ?", "a": "Grâce aux sirènes, aux médias tels que Radio France et France Télévision ou encore grâce à l’application SAIP.", "practical": false, "note": "⚠️ Réponse attendue à l'examen, mais l'appli SAIP n'existe plus : c'est FR-Alert (alertes sur le téléphone) qui la remplace."}], [{"t": "Vérif. intérieure", "q": "Montrez le voyant d'alerte signalant un défaut de batterie.", "a": "Mettre le contact et montrer le voyant rouge en forme de batterie.", "practical": true}, {"t": "Sécurité routière", "q": "Qu'est-ce qui peut provoquer la décharge de la batterie, moteur éteint ?", "a": "Les feux ou accessoires électriques en fonctionnement.", "practical": false}, {"t": "Premiers secours", "q": "À partir de quel âge peut-on suivre une formation aux premiers secours ?", "a": "A partir de 10 ans.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Montrez l'emplacement de la batterie du véhicule.", "a": "Si le candidat a des difficultés pour ouvrir le capot, l'accompagnateur peut lui indiquer comment procéder.", "practical": false}, {"t": "Sécurité routière", "q": "Quelle est la solution en cas de panne de batterie pour démarrer le véhicule sans le déplacer ?", "a": "Brancher une deuxième batterie en parallèle (ou les \"+\" ensemble et les \"-\" ensemble) ou la remplacer.", "practical": false}, {"t": "Premiers secours", "q": "Pourquoi faut-il pratiquer immédiatement une réanimation cardio-pulmonaire sur une victime en arrêt cardiaque ?", "a": "Car les lésions du cerveau, surviennent dès les premières minutes.", "practical": false}], [{"t": "Vérif. intérieure", "q": "De quelle couleur est le voyant qui indique une défaillance du système de freinage ?", "a": "Rouge.", "practical": false}, {"t": "Sécurité routière", "q": "Quel est le risque de circuler avec un frein de parking mal desserré ?", "a": "Une dégradation du système de freinage.", "practical": false}, {"t": "Premiers secours", "q": "Hors autoroute ou endroit dangereux, en cas de panne ou d’accident, où doit être placé le triangle de pré-signalisation ?", "a": "Le triangle de pré-signalisation doit être placé à une distance d’environ 30 m de la panne ou de l’accident, ou avant un virage, ou un sommet de côte.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Contrôlez l'état, la propreté et le fonctionnement des feux de croisement.", "a": "Vérification des feux, propres, en bon état et fonctionnent (toute anomalie doit être signalée).", "practical": false}, {"t": "Sécurité routière", "q": "Quelles sont les conséquences d'un mauvais réglage de ces feux ?", "a": "Une mauvaise vision vers l'avant et un risque d'éblouissement des autres usagers.", "practical": false}, {"t": "Premiers secours", "q": "Dans quelle situation peut-on déplacer une victime ?", "a": "En présence d’un danger réel, immédiat, non contrôlable. Le déplacement de la victime doit rester exceptionnel.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Montrez le voyant d'alerte signalant une température trop élevée du liquide de refroidissement.", "a": "Montrer le voyant rouge en forme de thermomètre dans des vagues.", "practical": true}, {"t": "Sécurité routière", "q": "Quelle est la conséquence d'une température trop élevée de ce liquide ?", "a": "Une surchauffe ou une casse moteur.", "practical": false}, {"t": "Premiers secours", "q": "Lors d’un appel avec les services de secours, pourquoi devez-vous attendre que votre correspondant vous autorise à raccrocher ?", "a": "Car il peut nous conseiller ou nous guider dans la réalisation des gestes à faire, ou ne pas faire, jusqu’à l’arrivée des secours.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Vérifiez l'état et la propreté des dispositifs réfléchissants.", "a": "Vérification des dispositifs, propres et en bon état (toute anomalie doit être signalée).", "practical": false}, {"t": "Sécurité routière", "q": "Quelle est l'utilité des dispositifs réfléchissants ?", "a": "Rendre visible le véhicule la nuit.", "practical": false}, {"t": "Premiers secours", "q": "À quel moment pouvez-vous mettre fin à un appel avec les secours ?", "a": "Uniquement lorsque notre correspondant nous invite à le faire.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Montrez le voyant signalant la mauvaise fermeture d'une portière.", "a": "Ouvrir une portière, contact mis, et montrer le voyant (voiture avec porte ouverte).", "practical": true}, {"t": "Sécurité routière", "q": "Quelle précaution dois-je prendre pour que les enfants installés à l'arrière ne puissent pas ouvrir leur portière ?", "a": "Actionner la sécurité enfant sur les deux portières arrière.", "practical": false}, {"t": "Premiers secours", "q": "Citez les trois manières d’évaluer l’état de conscience d’une victime.", "a": "- Lui poser des questions simples (\"comment ça va ?\", \"vous m'entendez ?\").\n- Lui secouer doucement les épaules.\n- Lui prendre la main en lui demandant d'exécuter un geste simple (\"serrez-moi la main\").", "practical": false}], [{"t": "Vérif. extérieure", "q": "Contrôlez l'état, la propreté et le fonctionnement des feux de position à l'avant et à l'arrière du véhicule.", "a": "Vérification des feux, propres, en bon état et fonctionnent (toute anomalie doit être signalée).", "practical": false}, {"t": "Sécurité routière", "q": "Par temps clair, à quelle distance doivent-ils être visibles ?", "a": "A 150 mètres.", "practical": false}, {"t": "Premiers secours", "q": "Quels sont les risques pour une personne en perte de connaissance qui est allongée sur le dos ?", "a": "L’arrêt respiratoire et l’arrêt cardiaque.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Actionnez les feux de détresse.", "a": "Appuyer sur le bouton triangle rouge (tableau de bord / console centrale).", "practical": true}, {"t": "Sécurité routière", "q": "Quand les utilise-t-on ?", "a": "En cas de panne, d’accident ou de ralentissement important.", "practical": false}, {"t": "Premiers secours", "q": "Quels comportements adopter en cas de diffusion du signal d’alerte du Système d’Alerte et d’Information des Populations (SAIP) ?", "a": "- Se mettre en sécurité.\n- S'informer grâce aux médias et sites internet des autorités dès que leur consultation est possible.\n- Respecter les consignes des autorités.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Sur le flanc d’un pneumatique, désignez le repère du témoin d'usure de la bande de roulement.", "a": "Repérer le petit triangle ou le sigle « TWI » sur le flanc : il indique où se trouvent les témoins d'usure dans les rainures.", "practical": true}, {"t": "Sécurité routière", "q": "Qu'est-ce que l'aquaplanage, et quelle peut être sa conséquence ?", "a": "La présence d'un film d'eau entre le pneumatique et la chaussée pouvant entraîner une perte de contrôle du véhicule.", "practical": false}, {"t": "Premiers secours", "q": "Si un dégagement d'urgence de la victime est nécessaire, où doit-elle être déplacée ?", "a": "Dans un endroit suffisamment éloigné du danger et de ses conséquences.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Montrez la commande permettant d’actionner le régulateur de vitesse.", "a": "Montrer la commande (souvent manette sous le volant ou boutons sur le volant).", "practical": true}, {"t": "Sécurité routière", "q": "Sans actionner la commande du régulateur, comment le désactiver rapidement ?", "a": "En appuyant sur la pédale de frein ou d'embrayage.", "practical": false}, {"t": "Premiers secours", "q": "Sur autoroute, comment indiquer avec précision les lieux de l’accident depuis un téléphone portable ?", "a": "En indiquant le numéro de l’autoroute, le sens de circulation et le point kilométrique.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Ouvrez la trappe à carburant et/ou vérifiez la bonne fermeture du bouchon.", "a": "Ouvrir la trappe et vérifier que le bouchon est bien vissé / fermé.", "practical": true}, {"t": "Sécurité routière", "q": "Quelles sont les précautions à prendre lors du remplissage du réservoir ?", "a": "Arrêter le moteur, ne pas fumer, ne pas téléphoner.", "practical": false}, {"t": "Premiers secours", "q": "Pourquoi l’alerte auprès des services de secours doit-elle être rapide et précise ?", "a": "Pour permettre aux services de secours d'apporter les moyens adaptés aux victimes dans le délai le plus court.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Sans l'actionner, montrez la commande de l'avertisseur sonore.", "a": "Montrer le centre du volant (symbole klaxon), sans appuyer.", "practical": true}, {"t": "Sécurité routière", "q": "Dans quel cas peut-on utiliser l'avertisseur sonore en agglomération ?", "a": "En cas de danger immédiat.", "practical": false}, {"t": "Premiers secours", "q": "Pourquoi ne faut-il pas laisser une personne en perte de connaissance allongée sur le dos ?", "a": "Car elle risque un étouffement par :\n- Des liquides présents dans la gorge.\n- La chute de la langue en arrière.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Montrez où s'effectue le remplissage de l'huile moteur.", "a": "Le candidat montre le bouchon de remplissage. Si le candidat a des difficultés pour ouvrir le capot, l'accompagnateur peut lui indiquer comment procéder.", "practical": false}, {"t": "Sécurité routière", "q": "Quel est le risque d'un manque d'huile moteur ?", "a": "Un risque de détérioration ou de casse du moteur.", "practical": false}, {"t": "Premiers secours", "q": "L’utilisation d’un Défibrillateur Automatisé (DAE) sur une victime qui n’est pas en arrêt cardiaque présente-t-elle un risque ?", "a": "Non, car le défibrillateur se déclenche uniquement quand la victime est en arrêt cardiaque.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Montrez la commande permettant de désactiver l'airbag du passager avant.", "a": "Souvent une serrure à clé sur le côté de la planche de bord passager ou dans la boîte à gants, ou un réglage dans le menu du véhicule.", "practical": true}, {"t": "Sécurité routière", "q": "Dans quelle situation doit-on le désactiver ?", "a": "Lors du transport d'un enfant à l'avant dans un siège auto, dos à la route.", "practical": false}, {"t": "Premiers secours", "q": "Quelles sont les conditions pour réaliser le dégagement d’urgence d’une victime en présence d’un danger réel, immédiat et non contrôlable ?", "a": "La victime doit être visible, facile à atteindre et rien ne doit gêner son dégagement. Il faut être sûr(e) de pouvoir réaliser le dégagement de la victime.", "practical": false}], [{"t": "Vérif. extérieure", "q": "A l'aide de la plaque indicative, donnez la pression préconisée pour les pneumatiques arrières, véhicule chargé.", "a": "Trouver la plaque (souvent sur le montant de la portière conducteur ou la trappe à carburant) et lire la valeur « arrière, véhicule chargé ».", "practical": true}, {"t": "Sécurité routière", "q": "À quelle fréquence est-il préconisé de vérifier la pression des pneus ?", "a": "Chaque mois, pour une utilisation normale de son véhicule, et avant chaque long trajet.", "practical": false}, {"t": "Premiers secours", "q": "Comment et pourquoi protéger une zone de danger en cas d’accident de la route ?", "a": "En délimitant clairement et largement la zone de danger de façon visible pour protéger les victimes et éviter un sur-accident.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Montrez le voyant signalant l'absence de bouclage de la ceinture de sécurité du conducteur.", "a": "Mettre le contact et montrer le voyant rouge en forme de personnage avec ceinture.", "practical": true}, {"t": "Sécurité routière", "q": "En règle générale, à partir de quel âge un enfant peut-il être installé sur le siège passager avant du véhicule ?", "a": "10 ans.", "practical": false}, {"t": "Premiers secours", "q": "Comment est composé le signal d’alerte du Système d’Alerte et d’Information des Populations (SAIP) diffusé par les sirènes ?", "a": "Il se compose de deux codes distincts :\n- Le Signal National d’Alerte (SNA), variation du signal sur trois cycles successifs.\n- Le signal de fin d’alerte, signal continu.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Vérifiez le fonctionnement de l'éclairage de la plaque d'immatriculation à l'arrière.", "a": "Toute anomalie doit être signalée.", "practical": false}, {"t": "Sécurité routière", "q": "Un défaut d'éclairage de la plaque lors du contrôle technique entraîne-t-il une contre- visite ?", "a": "Oui.", "practical": false}, {"t": "Premiers secours", "q": "Quelles sont les trois informations à transmettre aux services de secours ?", "a": "Le numéro de téléphone à partir duquel l’appel est émis, la nature et la localisation la plus précise du problème.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Vérifiez la présence de l'attestation d'assurance du véhicule et de sa vignette sur le pare-brise.", "a": "Généralement dans la boîte à gants.", "practical": true, "note": "⚠️ Bon à savoir : la vignette et la carte verte d'assurance sont supprimées depuis le 1er avril 2024."}, {"t": "Sécurité routière", "q": "Quels sont les deux autres documents obligatoires à présenter en cas de contrôle par les forces de l'ordre ?", "a": "Le certificat d'immatriculation et le permis de conduire. Le terme « carte grise » est accepté.", "practical": false}, {"t": "Premiers secours", "q": "Qu’est ce qu’une hémorragie ?", "a": "C’est une perte de sang prolongée qui ne s’arrête pas. Elle imbibe de sang un mouchoir en quelques secondes.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Indiquez où se situe la sécurité enfant sur l'une des portières à l’arrière du véhicule.", "a": "Sur la tranche de la portière arrière (côté serrure), visible porte ouverte.", "practical": true}, {"t": "Sécurité routière", "q": "Si la sécurité enfant est enclenchée, est-il possible d'ouvrir la portière arrière depuis l'extérieur ?", "a": "Oui.", "practical": false}, {"t": "Premiers secours", "q": "Quels sont les risques pour une personne victime d’une hémorragie ?", "a": "Entraîner pour la victime une détresse circulatoire ou un arrêt cardiaque.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Allumez le(s) feu(x) de brouillard arrière(s) et montrez le voyant correspondant.", "a": "Allumer d'abord les feux de croisement, puis le brouillard arrière ; montrer le voyant orange qui s'allume.", "practical": true}, {"t": "Sécurité routière", "q": "Pouvez-vous les utiliser par forte pluie ?", "a": "Non.", "practical": false}, {"t": "Premiers secours", "q": "Quels sont les signes d’un arrêt cardiaque ?", "a": "La victime ne répond pas, ne réagit pas et ne respire pas ou présente une respiration anormale.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Avec l'assistance de l'accompagnateur, contrôlez l'état, la propreté et le fonctionnement du ou des feux de recul.", "a": "Vérification des feux, propres, en bon état et qui fonctionnent (toute anomalie doit être signalée).", "practical": false}, {"t": "Sécurité routière", "q": "Quelles sont leurs deux utilités ?", "a": "- Éclairer la zone de recul la nuit.\n- Avertir les autres usagers de la manœuvre.", "practical": false}, {"t": "Premiers secours", "q": "Qu’est ce qu’un défibrillateur automatisé externe (DAE) ?", "a": "C’est un appareil qui peut permettre de rétablir une activité cardiaque normale à une victime en arrêt cardiaque.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Montrez comment régler la hauteur de l'appui-tête du siège conducteur.", "a": "Appuyer sur le bouton à la base de l'appui-tête et le faire coulisser.", "practical": true}, {"t": "Sécurité routière", "q": "Quelle est son utilité ?", "a": "Permet de retenir le mouvement de la tête en cas de choc et de limiter les blessures.", "practical": false}, {"t": "Premiers secours", "q": "Par quels moyens doit être réalisée l’alerte des secours ?", "a": "L’alerte doit être donnée à l’aide d’un téléphone portable ou, à défaut, d’un téléphone fixe, ou d’une borne d’appel d’urgence.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Avec l'assistance de l'accompagnateur, contrôlez l'état, la propreté et le fonctionnement des feux de stop.", "a": "Vérification des feux, propres, en bon état et fonctionnent (toute anomalie doit être signalée).", "practical": false}, {"t": "Sécurité routière", "q": "Quelle est la conséquence en cas de panne des feux de stop ?", "a": "Un manque d'information pour les usagers suiveurs et un risque de collision.", "practical": false}, {"t": "Premiers secours", "q": "Lors d’un appel avec les services de secours, pourquoi devez-vous attendre que votre correspondant vous autorise à raccrocher ?", "a": "Car il peut nous conseiller ou nous guider dans la réalisation des gestes à faire, ou ne pas faire, jusqu’à l’arrivée des secours.", "practical": false}], [{"t": "Vérif. intérieure", "q": "De quelle couleur est le voyant qui indique au conducteur que le feu de brouillard arrière est allumé ?", "a": "Orange.", "practical": false}, {"t": "Sécurité routière", "q": "Quelle est la différence entre un voyant orange et un voyant rouge ?", "a": "- Rouge : Une anomalie de fonctionnement ou un danger.\n- Orange : un élément important.", "practical": false}, {"t": "Premiers secours", "q": "Qu’est ce qu’un arrêt cardiaque ?", "a": "Le cœur ne fonctionne plus ou fonctionne d’une façon anarchique.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Ouvrez et refermez le capot, puis vérifiez sa bonne fermeture.", "a": "Tirer la manette dans l'habitacle, débloquer le crochet de sécurité à l'avant, ouvrir, puis refermer et vérifier qu'il est verrouillé.", "practical": true}, {"t": "Sécurité routière", "q": "En roulant, quel est le risque d'une mauvaise fermeture du capot ?", "a": "Un risque d'ouverture du capot pouvant entraîner un accident.", "practical": false}, {"t": "Premiers secours", "q": "Quel est le risque principal d’un arrêt cardiaque sans intervention des secours ?", "a": "La mort de la victime qui survient en quelques minutes.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Montrez la commande de recyclage de l'air.", "a": "Montrer le bouton (symbole voiture avec flèche en boucle).", "practical": true}, {"t": "Sécurité routière", "q": "Quel peut être le risque de maintenir le recyclage de l’air de manière prolongée ?", "a": "Un risque de mauvaise visibilité par l’apparition de buée sur les surfaces vitrées.", "practical": false}, {"t": "Premiers secours", "q": "Quels sont les risques pour une personne en perte de connaissance qui est allongée sur le dos ?", "a": "L’arrêt respiratoire et l’arrêt cardiaque.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Montrez l'orifice de remplissage du produit lave- glace.", "a": "Si le candidat a des difficultés pour ouvrir le capot, l'accompagnateur peut lui indiquer comment procéder.", "practical": false}, {"t": "Sécurité routière", "q": "Quel est le principal risque d'une absence de liquide lave-glace ?", "a": "Une mauvaise visibilité.", "practical": false}, {"t": "Premiers secours", "q": "Pourquoi faut-il pratiquer immédiatement une réanimation cardio-pulmonaire sur une victime en arrêt cardiaque ?", "a": "Car les lésions du cerveau surviennent dès les premières minutes.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Allumez les feux de route et montrez le voyant correspondant.", "a": "Pousser ou tirer la manette des feux ; montrer le voyant bleu.", "practical": true}, {"t": "Sécurité routière", "q": "Quel est le risque de maintenir les feux de route lors d'un croisement avec d'autres usagers ?", "a": "Un risque d'éblouissement des autres usagers.", "practical": false}, {"t": "Premiers secours", "q": "Quel est l’objectif du Signal d’Alerte et d’Information des Populations (SAIP) ?", "a": "Avertir la population d’un danger imminent ou qu’un événement grave est en train de se produire.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Vérifiez l'état, la propreté et le fonctionnement des feux diurnes.", "a": "Vérification des feux, propres, en bon état et qui fonctionnent (toute anomalie doit être signalée).", "practical": false}, {"t": "Sécurité routière", "q": "Quelle est leur utilité ?", "a": "Rendre le véhicule plus visible le jour.", "practical": false}, {"t": "Premiers secours", "q": "À quel moment pouvez-vous mettre fin à un appel avec les secours ?", "a": "Uniquement lorsque notre correspondant nous invite à le faire.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Vérifiez la présence du constat amiable dans le véhicule.", "a": "Généralement dans la boîte à gants.", "practical": true}, {"t": "Sécurité routière", "q": "En cas d'accident, dans quel délai doit-il être transmis à l'assureur ?", "a": "5 jours.", "practical": false}, {"t": "Premiers secours", "q": "Quel est le risque principal d’un arrêt cardiaque sans intervention des secours ?", "a": "La mort de la victime qui survient en quelques minutes.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Vérifiez la présence du triangle de pré-signalisation.", "a": "Montrer où il se trouve (souvent dans le coffre).", "practical": true}, {"t": "Sécurité routière", "q": "Utilise-t-on le triangle de pré-signalisation sur autoroute ?", "a": "Non", "practical": false}, {"t": "Premiers secours", "q": "Quel comportement doit-on adopter en présence d’une victime en arrêt cardiaque ?", "a": "- ALERTER: alerter immédiatement les secours.\n- MASSER: pratiquer une réanimation cardio-pulmonaire.\n- DEFIBRILLER: utiliser un défibrillateur automatique (DAE) si possible.", "practical": false}], [{"t": "Vérif. intérieure", "q": "De quelle couleur est le voyant qui indique une défaillance du système de freinage.", "a": "Rouge.", "practical": false}, {"t": "Sécurité routière", "q": "Quel est le risque de circuler avec un frein de parking mal desserré ?", "a": "Une dégradation du système de freinage.", "practical": false}, {"t": "Premiers secours", "q": "Comment arrêter une hémorragie ?", "a": "En appuyant fortement sur l’endroit qui saigne avec les doigts ou avec la paume de la main en mettant un tissu propre sur la plaie.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Montrez où s'effectue le changement d'une ampoule à l'avant du véhicule.", "a": "Si le candidat a des difficultés pour ouvrir le capot, l'accompagnateur peut lui indiquer comment procéder.", "practical": false}, {"t": "Sécurité routière", "q": "Quelles sont les conséquences en cas de panne d'un feu de croisement ?", "a": "Une mauvaise visibilité et le risque d'être confondu avec un deux roues.", "practical": false}, {"t": "Premiers secours", "q": "Citez les trois manières d’évaluer l’état de conscience d’une victime ?", "a": "- Lui poser des questions simples (\"comment ça va ?\", \"vous m'entendez ?\").\n- Lui secouer doucement les épaules.\n- Lui prendre la main en lui demandant d'exécuter un geste simple (\"serrez-moi la main\").", "practical": false}], [{"t": "Vérif. intérieure", "q": "Si le véhicule en est équipé, montrez la commande du limiteur de vitesse.", "a": "Montrer la commande (souvent manette sous le volant ou boutons sur le volant).", "practical": true}, {"t": "Sécurité routière", "q": "Quelle est l'utilité d'un limiteur de vitesse ?", "a": "Ne pas dépasser la vitesse programmée par le conducteur.", "practical": false}, {"t": "Premiers secours", "q": "Quels sont les numéros d’urgence à appeler ?", "a": "- Le 18, numéro d'appel des sapeurs-pompiers.\n- Le 15, numéro d'appel des SAMU.\n- Le 112, numéro de téléphone réservé aux appels d’urgence et valide dans l’ensemble de l’Union Européenne.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Montrez où s'effectue le changement d'une ampoule à l'arrière du véhicule.", "a": "Ouvrir le coffre et montrer l'accès aux blocs optiques arrière.", "practical": true}, {"t": "Sécurité routière", "q": "Quelles sont les conséquences en cas de panne d'un feu de position arrière ?", "a": "Être mal vu et un risque de collision.", "practical": false}, {"t": "Premiers secours", "q": "Comment est diffusée l’alerte émise par le Signal d’Alerte et d’Information aux Populations (SAIP) ?", "a": "Grâce aux sirènes, aux médias tels que Radio France et France Télévision ou encore grâce à l’application SAIP.", "practical": false, "note": "⚠️ Réponse attendue à l'examen, mais l'appli SAIP n'existe plus : c'est FR-Alert (alertes sur le téléphone) qui la remplace."}], [{"t": "Vérif. intérieure", "q": "Faites fonctionner l’essuie-glace arrière du véhicule.", "a": "Mettre le contact puis actionner l'essuie-glace arrière avec la manette.", "practical": true}, {"t": "Sécurité routière", "q": "Pour une bonne visibilité vers l’arrière, en plus de l’utilisation de l’essuie-glace, quelle commande pouvez-vous actionner par temps de pluie ?", "a": "La commande de désembuage arrière. Le terme dégivrage peut remplacer celui de désembuage.", "practical": false}, {"t": "Premiers secours", "q": "Quels comportements adopter en présence d’une victime qui ne répond pas et ne réagit pas, mais respire ?", "a": "- La placer en position stable sur le côté ou position latérale de sécurité.\n- Alerter les secours.\n- Surveiller la respiration de la victime jusqu'à l'arrivée des secours.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Ouvrez et refermez le coffre, puis vérifiez sa bonne fermeture.", "a": "Ouvrir le coffre, le refermer, puis vérifier qu'il est bien verrouillé.", "practical": true}, {"t": "Sécurité routière", "q": "Lorsque vous transportez un poids important dans le coffre, quelles sont les précautions à prendre en ce qui concerne les pneumatiques et l'éclairage avant ?", "a": "Augmenter la pression des pneumatiques et régler la hauteur des feux avant.", "practical": false}, {"t": "Premiers secours", "q": "L’utilisation d’un Défibrillateur Automatisé (DAE) sur une victime qui n’est pas en arrêt cardiaque présente-t-elle un risque ?", "a": "Non car le défibrillateur se déclenche uniquement quand la victime est en arrêt cardiaque.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Indiquez où se situe les attaches de type Isofix dans le véhicule.", "a": "Pour info : les attaches de type Isofix sont obligatoires sur les véhicules neufs depuis 2011.", "practical": false}, {"t": "Sécurité routière", "q": "Peut-on fixer tous les sièges enfant sur des attaches de type Isofix ?", "a": "Non (uniquement ceux compatibles avec ce type d’attache).", "practical": false}, {"t": "Premiers secours", "q": "Comment vérifier la respiration d’une victime ?", "a": "Regarder si le ventre et la poitrine se soulèvent et sentir de l’air à l’expiration.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Ouvrez et refermez le coffre, puis vérifiez sa bonne fermeture.", "a": "Ouvrir le coffre, le refermer, puis vérifier qu'il est bien verrouillé.", "practical": true}, {"t": "Sécurité routière", "q": "Quels sont les risques de circuler avec des objets sur la plage arrière ?", "a": "Une mauvaise visibilité vers l'arrière et un risque de projection en cas de freinage brusque ou de choc.", "practical": false}, {"t": "Premiers secours", "q": "Qu’est ce qu’une hémorragie ?", "a": "C’est une perte de sang prolongée qui ne s’arrête pas. Elle imbibe de sang un mouchoir en quelques secondes.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Montrez sur le tableau de bord le voyant indiquant une baisse de pression d’air d’un pneumatique.", "a": "Pour info: obligatoire sur tous les véhicules neufs mis en circulation à compter du 01/11/2014.", "practical": false}, {"t": "Sécurité routière", "q": "À quelle fréquence est-il préconisé de vérifier la pression d’air des pneumatiques ?", "a": "Tous les mois", "practical": false}, {"t": "Premiers secours", "q": "Qu’est ce qu’un arrêt cardiaque ?", "a": "Le cœur ne fonctionne plus ou fonctionne d’une façon anarchique.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Procédez à l’ouverture du capot puis à sa fermeture en vous assurant de son verrouillage.", "a": "Tirer la manette dans l'habitacle, débloquer le crochet de sécurité, ouvrir, refermer et vérifier le verrouillage.", "practical": true}, {"t": "Sécurité routière", "q": "Pour un capot s’ouvrant depuis l’avant du véhicule, quelle est l’utilité du dispositif de sécurité ?", "a": "Empêcher l’ouverture du capot en circulation en cas de mauvais verrouillage.", "practical": false}, {"t": "Premiers secours", "q": "Quels sont les risques pour une personne victime d’une hémorragie ?", "a": "Entraîner pour la victime une détresse circulatoire ou un arrêt cardiaque.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Montrez la commande de réglage de hauteur des feux.", "a": "Dispositif en général à gauche du volant.", "practical": false}, {"t": "Sécurité routière", "q": "Pourquoi doit-on régler la hauteur des feux ?", "a": "Pour ne pas éblouir les autres usagers.", "practical": false}, {"t": "Premiers secours", "q": "Comment et pourquoi protéger une zone de danger en cas d’accident de la route ?", "a": "En délimitant clairement et largement la zone de danger de façon visible pour protéger les victimes et éviter un sur-accident.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Montrez où se situent les gicleurs de lave-glace avant.", "a": "Sur le capot ou à la base du pare-brise.", "practical": true}, {"t": "Sécurité routière", "q": "Quelle est la principale conséquence d’un dispositif de lave-glace défaillant ?", "a": "Une mauvaise visibilité due à l’impossibilité de nettoyer le pare-brise.", "practical": false}, {"t": "Premiers secours", "q": "Qu’est ce qu’un défibrillateur automatisé externe (DAE) ?", "a": "C’est un appareil qui peut permettre de rétablir une activité cardiaque normale à une victime en arrêt cardiaque.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Mettez le rétroviseur intérieur en position \"nuit\". Si le rétroviseur de l'accompagnateur gêne la manipulation du dispositif, l'explication suffit.", "a": "Si le véhicule possède un système automatique de mise en position \"nuit\" du rétroviseur intérieur, le candidat l'indique.", "practical": false}, {"t": "Sécurité routière", "q": "Quel est l’intérêt de la position nuit ?", "a": "Ne pas être ébloui par les feux du véhicule suiveur.", "practical": false}, {"t": "Premiers secours", "q": "Comment est composé le signal d’alerte du Système d’Alerte et d’Information des Populations (SAIP) diffusé par les sirènes ?", "a": "Il se compose de deux codes distincts : - le Signal National d’Alerte (SNA), variation du signal sur trois cycles successifs.\n- Le signal de fin d’alerte, signal continu.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Contrôlez l'état du flanc sur l'un des pneumatiques.", "a": "En bon état (toute anomalie doit être signalée).", "practical": false}, {"t": "Sécurité routière", "q": "Citez un endroit où l'on peut trouver les pressions préconisées pour les pneumatiques ?", "a": "Elles sont indiquées : - soit sur une plaque sur une portière. - soit dans la notice d'utilisation du véhicule. - soit au niveau de la trappe à carburant.", "practical": false}, {"t": "Premiers secours", "q": "Sur autoroute, comment indiquer avec précision les lieux de l’accident depuis un téléphone portable ?", "a": "En indiquant le numéro de l’autoroute, le sens de circulation et le point kilométrique.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Faites fonctionner les essuie-glaces avant du véhicule sur la position la plus rapide.", "a": "Mettre le contact puis la manette d'essuie-glace sur la position la plus rapide.", "practical": true}, {"t": "Sécurité routière", "q": "Comment détecter leur usure en circulation ?", "a": "En cas de pluie, lorsqu'ils laissent des traces sur le pare-brise.", "practical": false}, {"t": "Premiers secours", "q": "Comment vérifier la respiration d’une victime ?", "a": "Regarder si le ventre et la poitrine se soulèvent et sentir de l’air à l’expiration.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Montrez où s'effectue le contrôle du niveau du liquide de frein.", "a": "Le candidat montre que le niveau est entre le mini et le maxi. Si le candidat a des difficultés pour ouvrir le capot, l'accompagnateur peut lui indiquer comment procéder.", "practical": false}, {"t": "Sécurité routière", "q": "Quelle est la conséquence d'un niveau insuffisant du liquide de frein ?", "a": "Une perte d'efficacité du freinage.", "practical": false}, {"t": "Premiers secours", "q": "En cas de panne ou d’accident, quel équipement de sécurité doit être porté avant de quitter le véhicule ?", "a": "Il faut porter le gilet de haute visibilité avant de sortir du véhicule. Le terme \" gilet jaune\" peut être utilisé par le candidat.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Vérifiez la présence du gilet de haute visibilité.", "a": "Le candidat doit indiquer où il se trouve sans obligation de le sortir. Le terme \" gilet jaune\" peut être utilisé si le candidat ne comprend pas.", "practical": false}, {"t": "Sécurité routière", "q": "En cas de panne ou d'accident, quel autre accessoire de sécurité est obligatoire ?", "a": "Le triangle de pré-signalisation.", "practical": false}, {"t": "Premiers secours", "q": "Si un dégagement d'urgence de la victime est nécessaire, où doit-elle être déplacée ?", "a": "Dans un endroit suffisamment éloigné du danger et de ses conséquences.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Montrez où s'effectue le remplissage du liquide de refroidissement.", "a": "Le candidat ouvre le capot et montre le bocal. Si le candidat a des difficultés pour ouvrir le capot, l'accompagnateur peut lui indiquer comment procéder.", "practical": false}, {"t": "Sécurité routière", "q": "Quel est le danger si l'on complète le niveau du liquide lorsque le moteur est chaud ?", "a": "Un risque de brûlure.", "practical": false}, {"t": "Premiers secours", "q": "Comment arrêter une hémorragie ?", "a": "En appuyant fortement sur l’endroit qui saigne avec les doigts ou avec la paume de la main en mettant un tissu propre sur la plaie.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Actionnez le dégivrage de la lunette arrière et montrez le voyant ou le repère correspondant.", "a": "Appuyer sur le bouton (symbole rectangle avec flèches ondulées) et montrer le voyant qui s'allume.", "practical": true}, {"t": "Sécurité routière", "q": "Quelle peut être la conséquence d'une panne de dégivrage de la lunette arrière ?", "a": "Une insuffisance ou une absence de visibilité vers l'arrière.", "practical": false}, {"t": "Premiers secours", "q": "Hors autoroute ou endroit dangereux, en cas de panne ou d’accident, où doit être placé le triangle de pré-signalisation ?", "a": "Le triangle de pré-signalisation doit être placé à une distance d’environ 30 m de la panne ou de l’accident, ou avant un virage, ou un sommet de côte.", "practical": false}], [{"t": "Vérif. extérieure", "q": "Contrôlez l'état, la propreté et le fonctionnement de tous les clignotants côté trottoir.", "a": "Vérification des clignotants propres, en bon état et fonctionnent (toute anomalie doit être signalée).", "practical": false}, {"t": "Sécurité routière", "q": "Quelle est la signification d'un clignotement plus rapide ?", "a": "Non fonctionnement de l'une des ampoules.", "practical": false}, {"t": "Premiers secours", "q": "Quelles sont les conditions pour réaliser le dégagement d’urgence d’une victime en présence d’un danger réel, immédiat et non contrôlable ?", "a": "La victime doit être visible, facile à atteindre et rien ne doit gêner son dégagement. Il faut être sûr(e) de pouvoir réaliser le dégagement de la victime.", "practical": false}], [{"t": "Vérif. intérieure", "q": "Montrez le voyant d'alerte signalant une pression insuffisante d'huile dans le moteur.", "a": "Mettre le contact et montrer le voyant rouge en forme de burette d'huile.", "practical": true}, {"t": " const TYPECLS={"Vérif. intérieure":"t-vi","Vérif. extérieure":"t-ve","Sécurité routière":"t-qs","Premiers secours":"t-ps"};
const CAT=t=>t.startsWith("Vérif")?"verif":t;

// ---- Banque de questions uniques (beaucoup de numéros partagent les mêmes questions)
const BANK=[]; const byKey={};
DATA.forEach((trio,num)=>trio.forEach((q,slot)=>{
  const key=(q.q+"|"+q.a).toLowerCase().replace(/[^a-z0-9àâçéèêëîïôûùüÿœ]/g,"");
  if(!byKey[key]){byKey[key]={id:BANK.length,...q,nums:[]};BANK.push(byKey[key]);}
  if(!byKey[key].nums.includes(num)) byKey[key].nums.push(num);
  trio[slot].id=byKey[key].id;
}));

// ---- Sauvegarde locale (peut être indisponible : on garde alors tout en mémoire)
const KEY="permis-revisions-v1";
let S={lv:{},ex:{}};
let storageOK=true;   // passe à false si le navigateur refuse la sauvegarde
try{
  localStorage.setItem(KEY+"-test","1");
  storageOK = localStorage.getItem(KEY+"-test")==="1";
  const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));
}catch(e){storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOK=false;}}
const lvl=id=>S.lv[id]||0;            // 0 = jamais vu/raté … 4 = acquise
function grade(id,ok,max){S.lv[id]= ok? Math.min(max,lvl(id)+1) : 0; save();}

const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pad=n=>String(n).padStart(2,"0");

// Tire n questions en privilégiant les moins bien sues
function pick(pool,n){
  return pool.map(q=>({q,w:Math.random()+ (4-lvl(q.id))*0.6})).sort((a,b)=>b.w-a.w).slice(0,n).map(x=>x.q);
}
function tagHTML(q){return `<span class="tag ${TYPECLS[q.t]}">${q.t}</span>${q.practical?'<span class="tag pract">Geste pratique</span>':''}`;}
function noteHTML(q){return q.note?`<div class="note">${esc(q.note)}</div>`:"";}
let filter="all";
const FILTERS=[["all","Tout"],["verif","Vérifications"],["Sécurité routière","Sécurité routière"],["Premiers secours","Premiers secours"]];
function filtered(pool){return filter==="all"?pool:pool.filter(q=>CAT(q.t)===filter);}
function filtersHTML(noVerif){return `<div class="filters">${FILTERS.filter(f=>!(noVerif&&f[0]==="verif")).map(([k,l])=>`<button class="chip ${filter===k?"on":""}" data-f="${k}">${l}</button>`).join("")}</div>`;}
function bindFilters(cb){app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;cb();});}

// ================= ACCUEIL =================
function home(){
  location.hash="";
  // % = somme des niveaux / niveau max : chaque bonne réponse fait avancer la barre
  const total=BANK.reduce((s,q)=>s+lvl(q.id),0);
  const pct=Math.round(total/(4*BANK.length)*100);
  const seen=BANK.filter(q=>q.id in S.lv).length;
  const learning=BANK.filter(q=>lvl(q.id)>=1&&lvl(q.id)<3).length;
  const mastered=BANK.filter(q=>lvl(q.id)>=3).length;
  const exDone=Object.keys(S.ex).length;
  app.innerHTML=`
  <header><h1>Questions du permis</h1></header>
  <div class="hero"><div class="big">${pct}%</div>
    <div class="sub">${seen}/${BANK.length} questions vues · ${learning} en cours · ${mastered} maîtrisées</div>
    <div class="bar"><i style="width:${pct}%"></i></div></div>
  ${storageOK?"":`<div class="note" style="margin:-6px 0 14px">⚠️ Ce navigateur ne permet pas d'enregistrer la progression : elle sera perdue en fermant la page.</div>`}
  <div class="modes">
    <button class="mode" data-go="qcm"><div class="n" style="background:var(--vi)">1</div><div><b>QCM</b><span>Pour apprendre : choisis la bonne réponse parmi 4.</span></div></button>
    <button class="mode" data-go="flash"><div class="n" style="background:var(--qs)">2</div><div><b>Flashcards</b><span>Pour consolider : réponds de tête, puis vérifie.</span></div></button>
    <button class="mode" data-go="exam"><div class="n" style="background:var(--ps)">3</div><div><b>Examen blanc</b><span>Un numéro au hasard, les 3 questions, comme le jour J.</span></div></button>
  </div>
  <h2>Examens blancs · ${exDone}/100 numéros</h2>
  <div class="grid">${Array.from({length:100},(_,n)=>{const s=S.ex[n];return `<button class="${s===undefined?"":"s"+s}" data-n="${n}">${pad(n)}</button>`}).join("")}</div>
  <div class="legend"><span><i style="background:var(--ok)"></i>3/3</span><span><i style="background:#8fbf9f"></i>2/3</span><span><i style="background:#e8b98a"></i>1/3</span><span><i style="background:var(--ko)"></i>0/3</span><span><i style="background:#e9e5db"></i>pas encore fait</span></div>
  <p class="small">Le jour J, l'inspecteur prend les 2 derniers chiffres du compteur kilométrique. Numéro pair → vérification extérieure, impair → intérieure. La grille se remplit avec le mode Examen blanc : touche un numéro pour le passer.</p>
  <button class="reset" id="reset">Remettre la progression à zéro</button>`;
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>({qcm:qcmStart,flash:flashStart,exam:()=>examStart()})[b.dataset.go]());
  app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>examStart(+b.dataset.n));
  $("#reset").onclick=()=>{
    const m=document.createElement("div");m.className="modal";
    m.innerHTML=`<div class="card"><p class="q" style="font-size:18px">Tout remettre à zéro ?</p><p class="small">La progression de toutes les questions et des examens blancs sera effacée.</p><div class="actions"><button class="btn sec" id="no">Annuler</button><button class="btn ko" id="yes">Effacer</button></div></div>`;
    document.body.appendChild(m);
    m.querySelector("#no").onclick=()=>m.remove();
    m.querySelector("#yes").onclick=()=>{S={lv:{},ex:{}};save();m.remove();home();};
  };
}
function topbar(title){return `<header><button class="back" id="back">‹ Accueil</button><h1>${title}</h1></header>`;}
function bindBack(){$("#back").onclick=home;}
function progress(i,n,extra=""){return `<div class="prog"><span>Question ${i+1} / ${n}</span><span>${extra}</span></div><div class="pbar"><i style="width:${i/n*100}%"></i></div>`;}

// ================= QCM =================
// Les distracteurs sont pris parmi les réponses de la même catégorie, pour qu'ils soient crédibles.
let sess;
const isColor=q=>q.q.startsWith("De quelle couleur");
// Les vérifs intérieures/extérieures sont des gestes : en QCM on ne garde que les questions de couleur de voyant
const qcmOK=q=>CAT(q.t)!=="verif"||isColor(q);
function qcmStart(){
  if(filter==="verif") filter="all";
  app.innerHTML=topbar("QCM")+filtersHTML(true)+`<div class="card center"><p class="q">Série de 10 questions</p><p class="small">Les questions que tu rates reviennent plus souvent. Les vérifications (« montrez… », « contrôlez… ») sont des gestes : elles sont dans les flashcards et l'examen blanc.</p><div class="actions"><button class="btn" id="go">Commencer</button></div></div>`;
  bindBack(); bindFilters(qcmStart);
  $("#go").onclick=()=>{
    const pool=filtered(BANK.filter(qcmOK));
    sess={list:pick(pool,10),i:0,good:0,kind:"qcm"}; qcmShow();
  };
}
function qcmShow(){
  const q=sess.list[sess.i];
  const others= isColor(q) ? shuffle(["Rouge.","Orange.","Vert.","Bleu."].filter(c=>c!==q.a))
    : shuffle(BANK.filter(o=>CAT(o.t)===CAT(q.t)&&o.a!==q.a&&qcmOK(o)).map(o=>o.a));
  const opts=shuffle([q.a,...[...new Set(others)].slice(0,3)]);
  app.innerHTML=topbar("QCM")+progress(sess.i,sess.list.length,`${sess.good} ✓`)+`
  <div class="card">${tagHTML(q)}<p class="q">${esc(q.q)}</p>
  <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>
  <div id="after" class="hidden">${noteHTML(q)}<div class="actions"><button class="btn" id="next">Suivante</button></div></div></div>`;
  bindBack();
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const ok=opts[+b.dataset.k]===q.a;
    app.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(opts[+x.dataset.k]===q.a) x.classList.add("ok");});
    if(!ok) b.classList.add("ko"); else sess.good++;
    grade(q.id,ok,2);   // le QCM fait monter jusqu'au niveau 2 : il faut les flashcards pour « maîtriser »
    $("#after").classList.remove("hidden");
    $("#next").onclick=()=>{sess.i++; sess.i<sess.list.length?qcmShow():finish();};
  });
}

// ================= FLASHCARDS =================
function flashStart(){
  app.innerHTML=topbar("Flashcards")+filtersHTML()+`<div class="card center"><p class="q">Série de 15 cartes</p><p class="small">Lis la question, réponds à voix haute <b>comme devant l'inspecteur</b>, puis retourne la carte et sois honnête 😉</p><div class="actions"><button class="btn" id="go">Commencer</button></div></div>`;
  bindBack(); bindFilters(flashStart);
  $("#go").onclick=()=>{sess={list:pick(filtered(BANK),15),i:0,good:0,kind:"flash"}; flashShow();};
}
function cardHTML(q,showNums){
  return `<div class="card">${tagHTML(q)}<p class="q">${esc(q.q)}</p>${showNums?`<div class="nums">Numéros : ${q.nums.map(pad).join(", ")}</div>`:""}
  <div id="rev" class="actions"><button class="btn sec" id="show">Voir la réponse</button></div>
  <div id="back2" class="hidden"><div class="ans">${esc(q.a)}</div>${noteHTML(q)}
  <div class="actions"><button class="btn ko" id="no">Pas su</button><button class="btn ok" id="yes">Je savais ✓</button></div></div></div>`;
}
function bindCard(onGrade){
  $("#show").onclick=()=>{$("#rev").classList.add("hidden");$("#back2").classList.remove("hidden");};
  $("#yes").onclick=()=>onGrade(true); $("#no").onclick=()=>onGrade(false);
}
function flashShow(){
  const q=sess.list[sess.i];
  app.innerHTML=topbar("Flashcards")+progress(sess.i,sess.list.length,`${sess.good} ✓`)+cardHTML(q,true);
  bindBack();
  bindCard(ok=>{grade(q.id,ok,4); if(ok)sess.good++; sess.i++; sess.i<sess.list.length?flashShow():finish();});
}

// ================= EXAMEN BLANC =================
function examStart(n){
  if(n===undefined){
    // priorité aux numéros jamais faits ou ratés
    const cand=Array.from({length:100},(_,k)=>k).filter(k=>(S.ex[k]??-1)<3);
    const pool=cand.length?cand:Array.from({length:100},(_,k)=>k);
    n=pool[Math.random()*pool.length|0];
  }
  sess={n,list:DATA[n].map(q=>BANK[q.id]),i:0,good:0,kind:"exam"};
  app.innerHTML=topbar("Examen blanc")+`<div class="card center"><p class="small">Le compteur affiche … km</p><div class="counter">${pad(n)}</div>
  <p class="small">${n%2?"Impair → vérification <b>intérieure</b>":"Pair → vérification <b>extérieure</b>"}, puis sécurité routière et premiers secours.</p>
  <div class="actions"><button class="btn" id="go">C'est parti</button></div></div>`;
  bindBack(); $("#go").onclick=examShow;
}
function examShow(){
  const q=sess.list[sess.i];
  app.innerHTML=topbar(`Numéro ${pad(sess.n)}`)+progress(sess.i,3,`${sess.good} pt`)+cardHTML(q,false);
  bindBack();
  bindCard(ok=>{grade(q.id,ok,4); if(ok)sess.good++; sess.i++;
    if(sess.i<3) examShow(); else {S.ex[sess.n]=sess.good; save(); finish();}});
}

// ================= FIN DE SÉRIE =================
function finish(){
  const n=sess.list.length, g=sess.good;
  const msg=g===n?"Parfait 🎉":g>=n*0.7?"Bien joué !":"Ça viendra, on recommence 💪";
  app.innerHTML=topbar("Résultat")+`<div class="card center"><div class="score">${g}/${n}</div><p class="q">${msg}</p>
  ${sess.kind==="exam"?`<p class="small">À l'examen, chaque bonne réponse rapporte 1 point (3 au maximum).</p>`:""}
  <div class="actions"><button class="btn sec" id="h">Accueil</button><button class="btn" id="again">${sess.kind==="exam"?"Autre numéro":"Nouvelle série"}</button></div></div>`;
  bindBack(); $("#h").onclick=home;
  $("#again").onclick=()=>({qcm:qcmStart,flash:flashStart,exam:()=>examStart()})[sess.kind]();
}
home();
</script>
</body>
</html>
